# -------------------------------------------------------------------------
# AI Hub Config Data – Validation & Deployment
# -------------------------------------------------------------------------
# This workflow performs two critical tasks:
# 1. Validates `ais.json` on every
#    push to main and every pull request targeting main.
# 2. Deploys the repository content to GitHub Pages if the push is to main
#    and all checks pass.
# -------------------------------------------------------------------------

name: Validate & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FILES_TO_CHECK: "ais.json"

jobs:
  # =========================================================================
  # Validation job – runs on every push to main and every pull request
  # =========================================================================
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for comparisons

      # ----- JSON syntax check ------------------------------------------------
      - name: Validate JSON syntax
        run: |
          for file in ${{ env.FILES_TO_CHECK }}; do
            echo "Checking $file"
            python3 -m json.tool "$file"
          done

  # =========================================================================
  # Deployment job – only on pushes to main after successful validation
  # =========================================================================
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
