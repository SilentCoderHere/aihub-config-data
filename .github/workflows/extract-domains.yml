name: Extract Domains

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download hosts file
        run: |
          URL="https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
          curl -s -o hosts.txt "$URL"
          echo "✅ Downloaded hosts file"

      - name: Extract blocked domains to plain text
        run: |
          echo "Extracting domains from hosts file..."
          awk '/^0\.0\.0\.0/ {print $2}' hosts.txt | \
            grep -vE '^([0-9]{1,3}\.){3}[0-9]{1,3}$|^[a-fA-F0-9:]+$' | \
            sort -u > domains_new.txt

          COUNT=$(wc -l < domains_new.txt)
          echo "✅ Extracted $COUNT unique blocked domains"

      - name: Compare and commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f domains.txt ] || ! cmp -s domains.txt domains_new.txt; then
            mv domains_new.txt domains.txt
            git add domains.txt
            git commit -m "${COMMIT_MSG} [skip ci]"
            git push
            echo "🚀 Committed domains.txt"
          else
            echo "📝 No changes – nothing to commit"
            rm domains_new.txt
          fi
        env:
          COMMIT_MSG: ${{ github.event_name == 'workflow_dispatch' && 'manual update: domains' || 'update: domains' }}

      - name: Clean up
        if: always()
        run: rm -f hosts.txt domains_new.txt
